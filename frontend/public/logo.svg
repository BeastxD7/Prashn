<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-label="प्रश्न">
  <title>प्रश्न</title>

  <defs>
    <linearGradient id="textGradient" x1="0" y1="0" x2="0" y2="1">
      <stop id="stop1" offset="0%" stop-color="#3B82F6"></stop>
      <stop id="stop2" offset="100%" stop-color="#172554"></stop>
    </linearGradient>
  </defs>

  <style>
    @media (prefers-color-scheme: dark) {
