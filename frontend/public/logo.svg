  <a href="/" target="_self">
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="url(#textGradient)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji" font-weight="700" font-size="330" style="letter-spacing:-0.015em">
      प्रश्न
